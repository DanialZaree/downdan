name: publish-linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-tauri-linux:
    name: Linux (AppImage/deb/rpm) amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies and aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            aria2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare aria2c sidecar
        shell: bash
        run: node scripts/prepare-sidecar.mjs

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build & Draft Release (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLX_OFFLINE: 'true'
          NO_STRIP: 'true'
        with:
          projectPath: .
          tagName: v${{ steps.version.outputs.version }}
          releaseName: 'danDown v${{ steps.version.outputs.version }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false

      - name: Upload artifacts (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: dandown-linux-amd64-v${{ steps.version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
