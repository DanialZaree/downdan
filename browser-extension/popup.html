<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #141414;
        color: #fafafa;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand img {
        width: 20px;
        height: 20px;
        border-radius: 5px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 9px;
      }
      .row input[type='checkbox'] {
        accent-color: #fafafa;
        cursor: pointer;
      }
      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #262626;
        border: 1px solid #2a2a2a;
      }
      .online {
        color: #34d399;
      }
      .offline {
        color: #fbbf24;
      }
      p {
        font-size: 12px;
        color: #a1a1aa;
        margin: 8px 0 0;
        line-height: 1.4;
      }
      .section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #71717a;
        margin: 14px 0 6px;
      }
      .media-list {
        max-height: 200px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .media-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        background: #1d1d1d;
        border: 1px solid #2a2a2a;
      }
      .media-url {
        font-size: 11.5px;
        color: #fafafa;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .media-kind {
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 4px;
        background: #262626;
        border: 1px solid #323232;
        color: #a1a1aa;
      }
      button {
        background: #fafafa;
        color: #171717;
        border: none;
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }
      button:hover {
        background: #e4e4e7;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="danDown" />
        <strong>danDown Bridge</strong>
      </div>
      <span id="status" class="badge">Checking…</span>
    </div>
    <p>Intercepts downloads (&ge; 1 MB) and shows an IDM-style confirmation popup.</p>

    <div class="row">
      <label for="toggle-intercept" style="font-size: 12px">Auto-intercept downloads</label>
      <input id="toggle-intercept" type="checkbox" checked />
    </div>
    <div class="row">
      <label for="toggle-popup" style="font-size: 12px">Show IDM download popup</label>
      <input id="toggle-popup" type="checkbox" checked />
    </div>
    <div class="row">
      <label for="toggle-floating" style="font-size: 12px">Floating video/audio button</label>
      <input id="toggle-floating" type="checkbox" checked />
    </div>

    <div class="section-title">Detected Media on This Tab</div>
    <div id="media-list" class="media-list">
      <p id="media-empty">No streams detected yet. Play a video or track to capture it.</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
